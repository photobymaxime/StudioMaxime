<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b2e"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#ff5b2e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo + brand -->
  <g transform="translate(80, 80)">
    <circle cx="14" cy="14" r="14" fill="url(#brand)"/>
    <text x="44" y="22" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" letter-spacing="-0.02em">
      Maxime<tspan fill="#9a9aa3" font-weight="400">/studio</tspan>
    </text>
  </g>

  <!-- Main heading -->
  <text x="80" y="320" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700" fill="#f5f5f7" letter-spacing="-0.04em">
    Des sites web qui
  </text>
  <text x="80" y="430" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="100" font-weight="400" fill="url(#brand)" letter-spacing="-0.02em">
    convertissent.
  </text>

  <!-- Subtitle -->
  <text x="80" y="500" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#9a9aa3">
    Conception web sur mesure pour PME du Québec.
  </text>

  <!-- Footer -->
  <g transform="translate(80, 555)">
    <circle cx="6" cy="6" r="6" fill="#ff5b2e"/>
    <text x="22" y="11" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#f5f5f7">
      studiomaxime.ca
    </text>
    <text x="900" y="11" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#9a9aa3" letter-spacing="0.08em">
      FORFAITS DÈS 1 800 $
    </text>
  </g>
</svg>
